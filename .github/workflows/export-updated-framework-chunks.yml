name: Export updated framework chunks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-updated-framework-chunks.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export fixed-size base64 chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          src = Path('Fortescue_Finance_Competency_Framework_UPDATED.html')
          data = src.read_bytes()
          b64 = base64.b64encode(data).decode('ascii')
          out = Path('.export_chunks')
          out.mkdir(exist_ok=True)
          for old in out.glob('chunk_*.txt'):
              old.unlink()
          chunk_size = 40000
          chunks = [b64[i:i+chunk_size] for i in range(0, len(b64), chunk_size)]
          for i, chunk in enumerate(chunks):
              (out / f'chunk_{i:02d}.txt').write_text(chunk, encoding='ascii')
          manifest = f'bytes={len(data)}\nsha256={hashlib.sha256(data).hexdigest()}\nchunks={len(chunks)}\nbase64_chars={len(b64)}\n'
          (out / 'manifest.txt').write_text(manifest, encoding='ascii')
          print(manifest)
          PY
      - name: Commit export chunks
        shell: bash
        run: |
          git config user.name "Finance Framework Builder"
          git config user.email "actions@users.noreply.github.com"
          git add .export_chunks
          git diff --cached --quiet && exit 0
          git commit -m "Export updated Finance framework for download"
          git push
